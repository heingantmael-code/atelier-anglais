<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2e47f0"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Atelier d'anglais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout : une colonne d'app (max 640px), barre d'onglets fixe en bas ; correction façon stylo rouge de prof. */
:root{
  --bg:#eef1f7; --surface:#ffffff; --sunk:#e3e8f2; --ink:#141a2e; --muted:#59627e; --line:#d4dae8;
  --accent:#2e47f0; --accent-soft:#e2e7ff; --on-accent:#ffffff;
  --ok:#11804c; --ok-bg:#ddf3e7; --err:#cf2a37; --err-bg:#fde6e8; --warn:#9a5b00; --warn-bg:#fff1d6;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1120; --surface:#161b2f; --sunk:#1d2440; --ink:#e7eaf6; --muted:#9aa3c2; --line:#2a3152;
  --accent:#8492ff; --accent-soft:#252d5c; --on-accent:#0d1120;
  --ok:#4fd393; --ok-bg:#123124; --err:#ff6f7a; --err-bg:#3b161b; --warn:#ffc061; --warn-bg:#3a2a0e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1120; --surface:#161b2f; --sunk:#1d2440; --ink:#e7eaf6; --muted:#9aa3c2; --line:#2a3152;
  --accent:#8492ff; --accent-soft:#252d5c; --on-accent:#0d1120;
  --ok:#4fd393; --ok-bg:#123124; --err:#ff6f7a; --err-bg:#3b161b; --warn:#ffc061; --warn-bg:#3a2a0e; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 110px;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--sunk);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem;border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.err{background:var(--err-bg);color:var(--err)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.ai-only[hidden]{display:none!important}

/* Accueil */
.hero{background:var(--accent);color:var(--on-accent);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:1.9rem}
.hero .btn{background:var(--on-accent);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:.78rem;color:var(--muted)}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.levels button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700}
.levels button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:10px}
.unit{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--sunk);font-size:.85rem}
.badge.done{background:var(--ok-bg);color:var(--ok)}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* Session */
.session{display:flex;flex-direction:column;gap:18px;min-height:calc(100% - 20px)}
.topbar{display:flex;align-items:center;gap:12px}
.topbar .bar{flex:1;height:10px}
.x{width:40px;height:40px;border-radius:10px;border:0;background:var(--sunk);font-size:1.2rem;flex:none}
.prompt{font-family:var(--f-display);font-size:1.35rem;font-weight:700;line-height:1.3}
.sent{font-size:1.3rem;line-height:1.7}
.fr{font-size:1.15rem;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;font-size:1.05rem}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.bad{border-color:var(--err);background:var(--err-bg)}
.answer{min-height:58px;border-bottom:2px solid var(--line);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-bottom-width:3px;background:var(--surface);border-radius:10px;padding:8px 12px;font-size:1.02rem}
.chip.used{visibility:hidden}
.field{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);font-size:1.1rem}
.field:focus{border-color:var(--accent);outline:none}
textarea.field{min-height:92px;resize:vertical}
.gapline{font-size:1.3rem;line-height:2}
.gapline input{width:9em;max-width:60%;border:0;border-bottom:2.5px solid var(--accent);background:transparent;font-size:1.2rem;padding:0 4px;text-align:center}
.gapline input:focus{outline:none;background:var(--accent-soft)}
.hint{color:var(--muted);font-style:italic}
.toggle{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0;text-align:left}

/* Chasse aux fautes : stylo rouge */
.spot{font-size:1.35rem;line-height:2.1}
.spot .w{border:0;background:none;padding:2px 3px;margin:0 1px;border-radius:6px;font-size:inherit}
.spot .w:hover{background:var(--sunk)}
.spot .w.hit{color:var(--err);text-decoration:underline wavy var(--err);text-underline-offset:6px}
.spot .w.miss{background:var(--err-bg)}
.spot .w.isErr{color:var(--err);text-decoration:line-through 2px var(--err)}
.fix{color:var(--ok);font-weight:700;font-family:var(--f-display)}
.rulebox{border-left:4px solid var(--err);background:var(--surface);padding:12px 14px;border-radius:0 12px 12px 0}

.speakbig{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.round{width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.round.alt{background:var(--sunk);color:var(--ink);width:44px;height:44px}
.round svg{width:24px;height:24px}
.diff .ok{color:var(--ok);font-weight:700}
.diff .no{color:var(--err);text-decoration:underline wavy}

/* Feedback */
.fb{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:3px solid var(--line);z-index:30}
.fb .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--err);background:var(--err-bg)}
.fb h3{font-size:1.2rem}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--err)}
.fb .explain{max-height:30vh;overflow:auto;white-space:pre-wrap}
.actionbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:20}
.actionbar .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.actionbar .in .btn{flex:1}

/* Navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.68rem;min-width:0;font-weight:700;color:var(--muted);border-radius:10px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* Chat */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;line-height:1.45;min-width:0;overflow-wrap:anywhere}
.msg.bot{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--accent);color:var(--on-accent);align-self:flex-end;border-bottom-right-radius:4px}
.corr{align-self:flex-end;max-width:88%;background:var(--warn-bg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.corr s{color:var(--err)} .corr b{color:var(--ok)}
.composer{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.composer .in{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:48px;max-height:140px;font-size:1rem;padding:10px 12px}
.typing{color:var(--muted);font-style:italic}
details.rule{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.rule summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:700;list-style:none}
details.rule summary::-webkit-details-marker{display:none}
details.rule p{margin-top:8px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:50;font-weight:700;max-width:calc(100% - 32px)}
.empty{padding:24px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r)}

.ink{color:var(--ink)}
.stat small{font-size:.9rem;color:var(--muted)}
.lvl{font-family:var(--f-display);font-size:2.6rem;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--accent)}
.ladder{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.ladder i{height:8px;border-radius:4px;background:var(--sunk)}
.ladder i.done{background:var(--accent);opacity:.45}
.ladder i.cur{background:var(--accent)}
.wordcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.bigword{font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.bigword.frw{font-family:var(--f-body);font-size:1.5rem}
.frline{font-size:1.25rem;border-top:1px dashed var(--line);padding-top:10px}
.wordrow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 16px}
.wordrow:last-child{border-bottom:0}
.dots{display:flex;gap:4px;flex:none}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--sunk)}
.dots i.on{background:var(--ok)}
.reader{font-size:1.18rem;line-height:1.85;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.reader p{margin:0 0 12px}
.reader p:last-child{margin:0}
.rw{border:0;background:none;padding:0 1px;font-size:inherit;line-height:inherit;border-radius:4px;color:inherit}
.rw:hover{background:var(--sunk)}
.rw.sel{background:var(--accent-soft);color:var(--accent);box-shadow:0 2px 0 var(--accent)}
.pop{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));padding:0 16px;z-index:25}
.pop .in{max-width:640px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.pop .btn.ghost{color:var(--bg);border-color:transparent;min-height:30px;padding:2px 8px}
.pop .muted{color:inherit;opacity:.7}
.popw{font-family:var(--f-display);font-size:1.25rem}
.popfr{font-size:1.1rem}
details summary{list-style:none}

.skills{display:flex;flex-direction:column;gap:8px}
.skrow{display:grid;grid-template-columns:7.5em 3.2em 1fr 3em;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.skrow b{font-family:var(--f-display);color:var(--accent)}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.weeks div{display:flex;flex-direction:column;background:var(--sunk);border-radius:10px;padding:8px}
.weeks b{font-family:var(--f-display);font-size:1.3rem}
.examples{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.exline{background:none;border:0;text-align:left;padding:4px 0;color:var(--ink);display:flex;gap:6px;align-items:baseline;font-size:.95rem}
.exline svg{flex:none;color:var(--accent)}
.dlg{gap:10px}
.dline{display:flex;flex-direction:column;gap:2px;padding-left:10px;border-left:3px solid var(--accent)}
.dline.b{border-left-color:var(--ok)}
.dline b{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wordplay{background:none;border:0;text-align:left;padding:0;min-width:0;flex:1}

.dicgrid{display:grid;grid-template-columns:1fr;gap:14px}
.dicbtn{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums}
.dicbtn.tried{border-color:var(--warn);color:var(--warn)}
.dicbtn.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.dicdiff{font-size:1.15rem;line-height:1.8}
.diff .near{color:var(--warn);font-weight:700;text-decoration:underline dotted}

.audiowarn{background:var(--warn-bg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:.92rem;margin:0}
.dicbtn.wait{opacity:.35;border-style:dashed}

.round.mic.live{background:var(--err);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--err) 50%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
.micnote{background:var(--accent-soft);border-radius:10px;padding:8px 10px;margin:0}
.micnote a{color:var(--accent);font-weight:700;word-break:break-all}
.trline{color:var(--muted);font-style:italic}
.dfr{display:block;padding-left:20px}
.evalcard{border:2px solid var(--accent)}
.evq{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.evq.good{border-left-color:var(--ok)} .evq.bad{border-left-color:var(--err)}
.okc{color:var(--ok)} .errc{color:var(--err)}
.acc{border:2px solid var(--ok)}
.login{min-height:100%;justify-content:center}
.loginbox{max-width:420px;width:100%;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px}
.loginmsg{background:var(--err-bg);color:var(--err);border-radius:10px;padding:8px 10px;margin:0}
.accname{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;text-align:left;padding:0}
.accname .pill{margin-left:auto}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.2rem;flex:none}
.tapq p{margin:0}
.tapq .rw{font-family:inherit;font-weight:inherit}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
// ====== RÈGLES (façon Projet Voltaire) ======
// Une ligne = une phrase. « phrase | correction » : la faute est entre astérisques. Sans « | » : phrase correcte.
function R(id, lvl, cat, name, x, txt) {
  return {id, lvl, cat, name, x, ex: txt.trim().split("\n").map(l => { const i = l.indexOf(" |"); return i < 0 ? [l.trim()] : [l.slice(0, i).trim(), l.slice(i + 2).trim()]; })};
}
const RULES = [
// ---------- CONJUGAISON ----------
R("s3","A1","Conjugaison","3e personne : le -s du présent","Au présent simple, avec he / she / it (ou un nom singulier), le verbe prend un -s : she works, it costs, my brother lives. Verbes en -ch, -sh, -o, -x : -es (watches, goes). Consonne + y : -ies (studies).",`
My sister *live* in London. | lives
He *watch* TV every evening. | watches
The shop opens at nine.
This bag *cost* fifty euros. | costs
She *studys* law at university. | studies
My boss *go* to Spain every summer. | goes
It rains a lot in November.
Everybody *know* the answer. | knows`),
R("doesnt","A1","Conjugaison","does / doesn't avec he, she, it","À la 3e personne, l'auxiliaire est does : he doesn't know, does she work? Le verbe qui suit reste à la base, sans -s.",`
He *don't* like coffee. | doesn't
*Do* your brother speak Spanish? | Does
She *doesn't knows* the answer. | doesn't know
It doesn't matter.
*Does she works* on Saturdays? | Does she work
My car *don't* start in the morning. | doesn't
Does he live near here?`),
R("neg","A1","Conjugaison","La négation : do not + verbe","On ne met pas « no » ou « not » directement devant un verbe ordinaire : I don't like, she doesn't work. Not se place seul seulement après be ou un modal (I'm not, I can't).",`
I *no like* fish. | don't like
She *not works* here anymore. | doesn't work
We don't have a car.
They *not understand* the question. | don't understand
I'm not ready yet.
He *no speaks* French. | doesn't speak`),
R("didbase","A2","Conjugaison","Après did : verbe à la base","Did porte déjà le passé : le verbe suivant reste à l'infinitif sans to. I didn't go (jamais didn't went), did you see?",`
I *didn't went* to the party. | didn't go
*Did you saw* the match? | Did you see
We didn't buy anything.
She *didn't called* me back. | didn't call
*Did he gave* you the keys? | Did he give
Did you enjoy the film?
They *didn't wanted* to leave. | didn't want`),
R("ilya","A1","Grammaire","« Il y a » = there is / there are","Il y a = there is (singulier) / there are (pluriel). Jamais « it has » ni « it is ». Au passé : there was / there were.",`
*It has* a lot of people here. | There are
*There is* many problems with this plan. | There are
There's a pharmacy around the corner.
*It is* a problem with my order. | There is
There were three messages for you.
*There was* fifty people at the meeting. | There were`),
R("age","A1","Conjugaison","L'âge : be, pas have","En anglais, on EST son âge : I'm 30 (years old). Jamais « I have 30 years ».",`
I *have 25 years*. | am 25

}

TX("t_b_nego","business","B2","Negotiating a contract",`
Last week we negotiated a two-year supply contract with a large hotel chain. They wanted a fifteen per cent discount on our standard prices, which was impossible for us: our margins are already quite low.
Instead of saying no, we asked questions to understand their real priorities. It turned out that price was not their only concern. They had had problems with late deliveries from their previous supplier, and reliability mattered more to them than anything else.
So we made a counter-offer: a seven per cent discount, guaranteed delivery within 48 hours, and a penalty clause if we fail to meet that commitment. In exchange, they agreed to a minimum order volume and payment within thirty days.
After two meetings, we reached an agreement that works for both sides. It was a good reminder that a successful negotiation is not about winning, but about finding a deal that both parties can live with.`,

{t:"sp",en:"I'm looking for a new job at the moment.",fr:"Je cherche un nouveau travail en ce moment."}
]},
{id:"u3",lvl:"A2",title:"Le prétérit",focus:"prétérit régulier (-ed) et irrégulier, did / didn't",items:[
{t:"gap",s:"Yesterday I ___ my keys at the office.",v:"leave",a:["left"],x:"Leave – left – left."},
{t:"gap",s:"We ___ a great film last night.",v:"see",a:["saw"],x:"See – saw – seen."},
{t:"mcq",q:"« Tu as vu Paul hier ? »",o:["Did you see Paul yesterday?","Have you seen Paul yesterday?","Did you saw Paul yesterday?"],a:0,x:"Yesterday = moment terminé → prétérit. Après did : base verbale."},
{t:"tr",fr:"Je ne suis pas allé au travail lundi.",a:["I didn't go to work on Monday.","I did not go to work on Monday."],d:["went","at"],x:"Didn't + base : didn't go."},
{t:"spot",s:"She *buyed* a new phone.",f:"bought",x:"Buy est irrégulier : buy – bought – bought."},
{t:"ls",en:"We stayed at a small hotel near the beach."},
{t:"gap",s:"How much ___ it cost?",v:"",a:["did"],x:"Question au passé : did + sujet + base."},
{t:"tr",fr:"Il y a deux ans, j'ai déménagé à Bordeaux.",a:["Two years ago, I moved to Bordeaux.","I moved to Bordeaux two years ago."],d:["since","have"],x:"Il y a = ago, avec le prétérit."},
{t:"mcq",q:"Prétérit de « think » ?",o:["thought","thinked","taught"],a:0,x:"Think – thought – thought. Taught vient de teach."},
{t:"sp",en:"I spent the weekend with my family.",fr:"J'ai passé le week-end avec ma famille."}
]},
{id:"irr",lvl:"A2",title:"Verbes irréguliers",focus:"les 60 verbes irréguliers les plus utiles",gen:"irreg",items:[]},
{id:"u4",lvl:"B1",title:"Present perfect",focus:"present perfect vs prétérit, since / for, ever / never / already / yet",items:[
{t:"gap",s:"I ___ here since 2019.",v:"live",a:["have lived","'ve lived","have been living","'ve been living"],x:"Depuis + action qui continue → present perfect."},
{t:"mcq",q:"« Je la connais depuis 10 ans. »",o:["I've known her for 10 years.","I know her since 10 years.","I've known her since 10 years."],a:0,x:"Present perfect + for (durée)."},
{t:"tr",fr:"Tu es déjà allé à Londres ?",a:["Have you ever been to London?","Have you been to London?"],d:["Did","gone","in"],x:"Expérience de vie : present perfect + ever. Been to = être allé (et revenu)."},
{t:"spot",s:"I *have finished* the report last night.",f:"finished",x:"Last night = moment terminé → prétérit."},
{t:"gap",s:"She hasn't called me ___.",v:"",a:["yet"],x:"Yet en fin de phrase négative ou interrogative = encore / déjà."},
{t:"ls",en:"I've never been to the United States."},
{t:"mcq",q:"Choisis : « We ___ each other for ages. »",o:["have known","know","knew"],a:0,x:"For ages + situation qui dure → present perfect."},
{t:"tr",fr:"Depuis combien de temps apprends-tu l'anglais ?",a:["How long have you been learning English?","How long have you learned English?","How long have you learnt English?"],d:["since","are"],x:"Depuis combien de temps = How long + present perfect (continu)."},
{t:"gap",s:"I've ___ finished my homework, so I can go out.",v:"",a:["already"],x:"Already = déjà, entre have et le participe."},
{t:"sp",en:"I've been working here for three years.",fr:"Je travaille ici depuis trois ans."}
]},
{id:"u5",lvl:"B1",title:"Parler du futur",focus:"will, be going to, présent continu pour les rendez-vous",items:[
{t:"mcq",q:"Le téléphone sonne. « J'y vais ! »",o:["I'll get it!","I'm going to get it!","I get it!"],a:0,x:"Décision prise sur le moment : will."},
{t:"gap",s:"Look at those clouds. It ___ rain.",v:"",a:["is going to","'s going to"],x:"Prédiction basée sur un signe visible : be going to."},
{t:"tr",fr:"Je vois le médecin demain matin.",a:["I'm seeing the doctor tomorrow morning.","I am seeing the doctor tomorrow morning."],d:["will","see"],x:"Rendez-vous fixé : présent continu."},
{t:"spot",s:"I'll call you when I *will arrive*.",f:"arrive",x:"Après when / as soon as au sens futur : présent simple."},
{t:"ls",en:"We're going to move to a bigger flat next year."},
{t:"gap",s:"Don't worry, I ___ tell anyone.",v:"",a:["won't","will not"],x:"Promesse négative : won't."},
{t:"tr",fr:"Qu'est-ce que tu vas faire ce week-end ?",a:["What are you going to do this weekend?","What are you doing this weekend?"],d:["will","make"],x:"Projet : be going to, ou présent continu."},
{t:"mcq",q:"« Je pense qu'il va gagner. »",o:["I think he'll win.","I think he wins.","I think he winning."],a:0,x:"Opinion sur le futur : I think + will."},
{t:"sp",en:"I'll let you know as soon as I hear from them.",fr:"Je te tiens au courant dès que j'ai de leurs nouvelles."}
]},
{id:"u6",lvl:"A2",title:"Poser des questions",focus:"auxiliaires do / does / did, mots interrogatifs, questions indirectes",items:[
{t:"gap",s:"Where ___ she work?",v:"",a:["does"],x:"She → does."},
{t:"tr",fr:"À quelle heure commence le film ?",a:["What time does the film start?","What time does the movie start?"],d:["starts","do"],x:"What time + does + sujet + base."},
{t:"spot",s:"Where *you live*?",f:"do you live",x:"Il faut l'auxiliaire : Where do you live?"},
{t:"mcq",q:"« Peux-tu me dire où est la gare ? »",o:["Can you tell me where the station is?","Can you tell me where is the station?"],a:0,x:"Question indirecte : sujet + verbe, ordre normal."},
{t:"ls",en:"How long does it take to get there?"},
{t:"gap",s:"Who ___ you this book?",v:"give",a:["gave"],x:"Quand who est sujet, pas d'auxiliaire : Who gave you…?"},
{t:"tr",fr:"Combien ça coûte ?",a:["How much does it cost?","How much is it?"],d:["many","costs"],x:"Prix : How much."},
{t:"mcq",q:"« Ça te dérange si j'ouvre la fenêtre ? »",o:["Do you mind if I open the window?","Does it disturb you if I open the window?"],a:0,x:"Formule naturelle : Do you mind if…?"},
{t:"sp",en:"Could you tell me how to get to the city centre?",fr:"Pourriez-vous me dire comment aller au centre-ville ?"}
]},
{id:"u7",lvl:"B1",title:"Les modaux",focus:"can, could, must, have to, should, might",items:[
{t:"mcq",q:"« Tu devrais te reposer. » (conseil)",o:["You should rest.","You must to rest.","You should to rest."],a:0,x:"Should + base verbale pour un conseil."},
{t:"gap",s:"You ___ smoke here. It's forbidden.",v:"",a:["mustn't","must not","can't","cannot"],x:"Interdiction : mustn't / can't."},
{t:"gap",s:"You don't ___ to come if you're busy.",v:"",a:["have"],x:"Don't have to = pas obligé (≠ mustn't = interdit)."},
{t:"spot",s:"She *can speaks* three languages.",f:"can speak",x:"Après un modal : base verbale."},
{t:"tr",fr:"Il pourrait pleuvoir cet après-midi.",a:["It might rain this afternoon.","It could rain this afternoon.","It may rain this afternoon."],d:["can","rains"],x:"Possibilité : might / could / may."},
{t:"ls",en:"Could you speak a bit more slowly, please?"},
{t:"mcq",q:"« Quand j'étais petit, je savais nager. »",o:["When I was young, I could swim.","When I was young, I can swim."],a:0,x:"Capacité au passé : could."},
{t:"tr",fr:"Je dois partir à 18 heures.",a:["I have to leave at 6 pm.","I have to leave at 6.","I must leave at 6 pm.","I have to leave at six."],d:["must to","at the"],x:"Obligation : have to (ou must)."},
{t:"sp",en:"You don't have to decide right now.",fr:"Tu n'es pas obligé de décider tout de suite."}
]},
{id:"u8",lvl:"A2",title:"Comparer et quantifier",focus:"comparatif, superlatif, much / many, a few / a little",items:[
{t:"gap",s:"This flat is ___ than the last one.",v:"big",a:["bigger"],x:"Adjectif court : -er (et doublement de la consonne : big → bigger)."},
{t:"gap",s:"It's the ___ restaurant in town.",v:"good",a:["best"],x:"Good → better → the best."},
{t:"mcq",q:"« Il n'y a pas beaucoup de temps. »",o:["There isn't much time.","There isn't many time.","There aren't much time."],a:0,x:"Time est indénombrable → much."},
{t:"spot",s:"London is *more expensive that* Paris.",f:"more expensive than",x:"Comparaison : than."},
{t:"tr",fr:"J'ai quelques amis à Londres.",a:["I have a few friends in London.","I've got a few friends in London.","I have some friends in London."],d:["little","a little"],x:"A few + dénombrable pluriel."},
{t:"ls",en:"It's much cheaper to go by train."},
{t:"mcq",q:"« C'est le film le plus intéressant de l'année. »",o:["It's the most interesting film of the year.","It's the more interesting film of the year.","It's the most interesting film in the year."],a:0,x:"Superlatif long : the most + adjectif. « De l'année » = of the year."},
{t:"gap",s:"Could I have a ___ more milk, please?",v:"",a:["little","bit"],x:"A little + indénombrable (milk)."},
{t:"sp",en:"The weather is getting better and better.",fr:"Le temps s'améliore de plus en plus."}
]},
{id:"u9",lvl:"B1",title:"Les conditionnels",focus:"if + présent / will, if + prétérit / would, if + past perfect / would have",items:[
{t:"gap",s:"If you ___ hungry, there's some pizza in the fridge.",v:"be",a:["are","'re"],x:"Condition réelle : présent après if."},
{t:"gap",s:"If I ___ rich, I would travel the world.",v:"be",a:["were","was"],x:"Hypothèse : if + prétérit. Were est plus soutenu, was courant à l'oral."},
{t:"mcq",q:"« Si j'avais su, je serais venu. »",o:["If I had known, I would have come.","If I would have known, I would come.","If I knew, I would have come."],a:0,x:"Regret sur le passé : if + past perfect, would have + participe."},
{t:"spot",s:"If I *would have* a car, I'd drive to work.",f:"had",x:"Jamais would dans la partie en if."},
{t:"tr",fr:"À ta place, j'accepterais.",a:["If I were you, I would accept.","If I were you, I'd accept.","If I was you, I'd accept."],d:["will","am"],x:"Conseil : If I were you, I'd…"},
{t:"ls",en:"If it doesn't rain tomorrow, we'll go hiking."},
{t:"gap",s:"What ___ you do if you lost your job?",v:"",a:["would"],x:"Hypothèse : would."},
{t:"tr",fr:"S'il pleut, je resterai à la maison.",a:["If it rains, I'll stay at home.","If it rains, I will stay at home.","If it rains, I'll stay home.","If it rains, I will stay home."],d:["will rain","in"],x:"If + présent, will + base."},
{t:"sp",en:"If I had more time, I would learn to play the guitar.",fr:"Si j'avais plus de temps, j'apprendrais la guitare."}
]},
{id:"u10",lvl:"B1",title:"Prépositions",focus:"in / on / at (temps, lieu), prépositions après verbes et adjectifs",items:[
{t:"gap",s:"The meeting is on Monday ___ 10 o'clock.",v:"",a:["at"],x:"On + jour, at + heure précise."},
{t:"mcq",q:"« Je suis né en 1990. »",o:["I was born in 1990.","I was born on 1990.","I am born in 1990."],a:0,x:"In + année. Naître = to be born, au passé : was born."},
{t:"gap",s:"I'm really good ___ cooking.",v:"",a:["at"],x:"Good at + -ing."},
{t:"spot",s:"I'm *at* the train, I'll be there soon.",f:"on",x:"Transports collectifs : on the train, on the bus, on a plane."},
{t:"tr",fr:"Ça dépend de toi.",a:["It depends on you.","That depends on you."],d:["of","from"],x:"Depend on."},
{t:"ls",en:"I'll meet you at the station at half past six."},
{t:"gap",s:"She's married ___ a doctor.",v:"",a:["to"],x:"Married to (et non with)."},
{t:"mcq",q:"« Je suis à la maison. »",o:["I'm at home.","I'm at the home.","I'm in home."],a:0,x:"At home, sans article."},
{t:"sp",en:"I'm not very good at remembering names.",fr:"Je ne suis pas très doué pour retenir les prénoms."}
]},
{id:"u11",lvl:"B1",title:"Faux amis",focus:"actually, eventually, library, sensible, attend, control, deception",items:[

{t:"sp",en:"I eventually found a job that I really enjoy.",fr:"J'ai fini par trouver un travail qui me plaît vraiment."}
]},
{id:"u12",lvl:"B2",title:"Phrasal verbs essentiels",focus:"get up, find out, give up, look forward to, run out of, put off, turn down",items:[

{t:"gap",s:"Can you pick me ___ at the station?",v:"",a:["up"],x:"Pick up = passer prendre."},

{t:"mcq",q:"« Il faut que je rattrape mon retard. »",o:["I need to catch up.","I need to catch on.","I need to come up."],a:0,x:"Catch up = rattraper (son retard)."},

]}

RULES.push(
R("pourto","B1","Conjugaison","« pour + verbe » = to (pas for)","Pour exprimer un but : to + base (I came to learn). For + verbe n'existe pas, sauf for + -ing pour décrire l'usage d'un objet (a knife for cutting).",`
I came to London *for learn* English. | to learn
She saves money *for to buy* a house. | to buy
I called to ask a question.
We stopped *for have* lunch. | to have
This machine is used for cutting metal.
He works hard *for pay* his rent. | to pay`),
R("neither","B1","Grammaire","either / neither / me neither","En phrase négative, « non plus » = either (I don't either) ou neither (neither do I). Pour répondre à une phrase négative : Me neither, pas Me too.",`
I don't like it *too*. | either
- I can't swim. - *Me too*. | Me neither
She doesn't eat meat and I don't either.
- I'm not tired. - *So am I*. | Neither am I
- I love this song. - So do I.
He didn't come and his wife didn't come *too*. | either`),
R("despite","B2","Grammaire","despite / although","Despite / in spite of + nom ou -ing (despite the rain, despite being tired). Although + sujet + verbe (although it rained). Jamais « despite of » ni « despite it rained ».",`
We went out *despite of* the rain. | despite
*Despite it was* cold, we swam. | Although it was
Despite being tired, she finished the report.
*Although* the traffic, we arrived on time. | Despite
Although he's rich, he lives simply.
In spite *the* delay, the client was happy. | of the`),
R("unless","B2","Grammaire","unless = if … not","Unless signifie déjà « si … ne … pas » : on n'ajoute pas de négation. Unless you hurry = if you don't hurry.",`
We'll miss the train unless we *don't hurry*. | hurry
I won't go unless you *don't come* with me. | come
You can't enter unless you have a ticket.
*Unless* you don't pay, they'll cancel the order. | If
Unless it rains, we'll eat outside.
Don't call me unless it *isn't* urgent. | is`),
R("suggest","B2","Conjugaison","suggest / recommend : jamais + to","Suggest et recommend se construisent avec -ing (suggest going) ou that + sujet + base (suggest that we go). Jamais « suggest someone to do ».",`
He suggested *me to* take a break. | that I
I recommend *you to* book early. | that you
She suggested meeting on Monday.
They suggested *to go* to the beach. | going
I recommend trying the fish.
What do you suggest *me to* do? | that I`),
R("modalpast","B2","Conjugaison","Modal + have + participe passé","Pour juger le passé : should have done (aurait dû), must have done (a dû), can't have done (n'a pas pu), might have done (a peut-être). Toujours have + participe passé.",`
You *should have came* earlier. | should have come
She *must have forget* her keys. | must have forgotten
He can't have finished already.
I *should went* to the doctor. | should have gone
They might have missed the train.
We *must had* left the lights on. | must have`),
R("causative","B2","Conjugaison","have / get something done","Faire faire quelque chose par quelqu'un : have / get + objet + participe passé. I had my hair cut. We're having the house painted.",`
I had my hair *cutted* yesterday. | cut
We're having the kitchen *paint*. | painted
She got her car repaired last week.
I need to have my eyes *test*. | tested
I *cut my hair* at the hairdresser's yesterday. | had my hair cut
They had the documents translated.`),

// ---------- Collocations (avec exemples) ----------
function VX(id, part, lvl, name, txt) {
  const words = txt.trim().split("\n").map(l => { const [en, fr, exEn, exFr] = l.split(" | ").map(s => s.trim()); return {en, fr, ex: exEn ? [exEn, exFr] : null}; });
  return {id, part, lvl, name, words, colloc: true};
}

// ====== AUDIO ENREGISTRÉ : clés partagées entre l'appli et le générateur ======
function hash32(s) { let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return h >>> 0; }
// Ce qui est réellement prononcé : sans parenthèses ni guillemets français
function speakable(t) { return String(t || "").replace(/\([^)]*\)/g, " ").replace(/[«»]/g, "").replace(/\s+/g, " ").trim(); }
// Découpage en phrases (Chrome coupe les énoncés longs, et chaque phrase a son enregistrement)
function splitSpeech(t) { return (speakable(t).match(/[^.!?]+[.!?]*["')]*\s*/g) || []).map(x => x.trim()).filter(x => /[A-Za-z0-9]/.test(x)); }
function clipKey(voice, text) { return hash32(voice + "|" + text).toString(36); }

// Tout le contenu intégré qui peut être lu à voix haute, regroupé par paquet (chargé à la demande)
function collectSpeech() {
  const out = [], seen = new Set();
  const add = (group, text, voice = "a") => { splitSpeech(text).forEach(p => { const k = clipKey(voice, p); if (!seen.has(k)) { seen.add(k); out.push({k, group, voice, text: p}); } }); };
  const first = s => String(s).split(" / ")[0].trim();
  add("misc", "Hello! This is how I sound. Let's practise together.");
  THEMES.forEach(t => t.words.forEach(w => { add("v_" + t.id, first(w.en)); if (w.ex) add("v_" + t.id, w.ex[0]); }));
  UNITS.forEach(u => u.items.forEach(it => {
    const g = "u_" + u.id;
    if (it.t === "mcq" && /^[A-Za-z]/.test(it.o[it.a])) add(g, it.o[it.a]);
    if (it.t === "gap") add(g, it.s.replace("___", it.a[0]));
    if (it.t === "tr") add(g, it.a[0]);
    if (it.t === "ls" || it.t === "sp") add(g, it.en);
  }));
  SHADOW.forEach(c => c[1].forEach(p => add("shadow", p[0])));
  TEXTS.forEach(t => {
    const g = "t_" + t.id;
    add(g, t.text.replace(/\n+/g, " "));
    Object.keys(t.gloss).forEach(k => add(g, k));
    t.text.split(/\s+/).forEach(w => { const c = w.replace(/[’]/g, "'").replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g, "").replace(/^'+|'+$/g, ""); if (c) { add(g, c.toLowerCase()); if (/^[A-Z]/.test(c)) add(g, c); } });
  });
  DIALOGS.forEach(d => { const sp = [...new Set(d.lines.map(l => l[0]))]; d.lines.forEach(l => add("d_" + d.id, l[1], sp.indexOf(l[0]) === 0 ? "a" : "b")); });
  WRITE.forEach(w => add("write", w.model.replace(/\n+/g, " ")));
  if (typeof BANK !== "undefined") BANK.forEach(b => add("bank_" + b.part + "_" + b.lvl, b.en));
  // exemples affichés sous chaque règle (3 premières phrases, corrigées)
  RULES.forEach(r => r.ex.slice(0, 4).forEach(([s, f]) => { const [pre, post = ""] = s.split(/\*[^*]+\*/); add("rules_" + r.lvl, f == null ? s : (pre + f + post).replace(/\s+/g, " ").replace(/\s([.,!?])/g, "$1")); }));
  return out;
}
if (typeof module !== "undefined") module.exports = {hash32, speakable, splitSpeech, clipKey, collectSpeech};

function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}

const accClean = id => String(id || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9_-]/g, "").slice(0, 40);
const ACC_OK = () => !IN_CLAUDE && /^https?:/.test(location.protocol);

async function accPush(keepalive) {
  if (!ACC.id || !ACC_OK()) return;
  if (ACC.busy) { ACC.again = true; return; }
  ACC.busy = true;
  try {
    const r = await fetch(apiUrl(ACC.id), {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({updatedAt: S.updatedAt, data: S}), keepalive: !!keepalive});
    if (r.ok) { ACC.last = Date.now(); ACC.err = ""; }
    else if (r.status === 409) { ACC.err = ""; await accPull(true); }       // un autre appareil a plus récent : on le récupère
    else if (r.status === 429) { clearTimeout(ACC.timer); ACC.timer = setTimeout(accPush, 6000); }   // trop rapproché : nouvel envoi dans quelques secondes
    else ACC.err = "La sauvegarde en ligne a échoué (" + r.status + "). Ta progression reste gardée sur cet appareil.";
  } catch (e) { ACC.err = "Pas de connexion : la progression sera envoyée dès que possible."; }
  ACC.busy = false;
  if (ACC.again) { ACC.again = false; accPush(); }
}
// Récupère la progression du compte ; garde la plus récente des deux (appareil / serveur)
async function accPull(silent) {
  if (!ACC.id || !ACC_OK()) return;
  try {
    const r = await fetch(apiUrl(ACC.id), {cache: "no-store"});
    if (r.status === 404) { await accPush(); return "new"; }
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    if ((j.updatedAt || 0) > (S.updatedAt || 0)) {
      S = migrate(j.data); S.updatedAt = j.updatedAt;
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      ACC.last = Date.now();
      if (!silent && idle()) render();
      return "loaded";
    }
    if ((S.updatedAt || 0) > (j.updatedAt || 0)) await accPush();
    ACC.last = Date.now();
    return "same";
  } catch (e) { ACC.err = "Impossible de joindre le serveur de sauvegarde pour l'instant."; return "error"; }
}

async function pushCloud() {
  if (!cloudCol) return;
  if (cloudBusy) { cloudAgain = true; return; }
  cloudBusy = true;
  const p = parts();
  for (const k of Object.keys(p)) {
    const js = JSON.stringify(p[k]); if (pushed[k] === js) continue;
    try { await cloudCol.doc(k).set({json: js, updatedAt: S.updatedAt}); pushed[k] = js; } catch (e) { console.warn("sauvegarde", k, e); }
  }
  cloudBusy = false;
  if (cloudAgain) { cloudAgain = false; pushCloud(); }
}
async function initCloud() {
  if (!IN_CLAUDE) return;
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    cloudCol = db.collection("data/users/" + id);
    const [pr, vo, ex] = await Promise.all(["progress", "vocab", "extra"].map(k => cloudCol.doc(k).get()));
    if (pr.exists) {
      const core = JSON.parse(pr.data().json || "{}");
      if ((core.updatedAt || 0) > S.updatedAt) {
        const v = vo.exists ? JSON.parse(vo.data().json || "{}") : {};
        const x = ex.exists ? JSON.parse(ex.data().json || "{}") : {};
        S = migrate(Object.assign({}, core, v, x));
        const p = parts(); Object.keys(p).forEach(k => pushed[k] = JSON.stringify(p[k]));
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
        if (idle()) render();
      } else if (S.updatedAt > (core.updatedAt || 0)) pushCloud();
    } else if (S.updatedAt) pushCloud();
    cloudOn = true; if (idle() && TAB === "home") render();
  } catch (e) { console.warn("cloud", e); }
}

}
const fixedSentence = (s, f) => { const [a, b = ""] = s.split(/\*[^*]+\*/); return (a + (f || "") + b).replace(/\s+/g, " ").replace(/\s([.,!?])/g, "$1").trim(); };
// Phrase anglaise de référence d'un exercice (celle dont on donne la traduction)

    seen.add(en); out.push({en, fr: fr || "", lvl, part, src, voice, n});
  };
  UNITS.forEach(u => { const part = u.id === "u21" ? "business" : "daily"; u.items.forEach(it => {

  SHADOW.forEach(c => c[1].forEach(p => add(p[0], p[1], c[0] === "Commerce" ? "B1" : "A2", c[0] === "Commerce" ? "business" : "daily", c[0])));

  TEXTS.forEach(t => splitSpeech(t.text.replace(/\n+/g, " ")).forEach(x => add(x, "", t.lvl, t.part, t.title)));
  WRITE.forEach(w => splitSpeech(w.model.replace(/\n+/g, " ")).forEach(x => add(x, "", w.lvl, w.part, w.title)));
  RULES.forEach(r => r.ex.slice(0, 4).forEach(([x, f]) => { const [pre, post = ""] = x.split(/\*[^*]+\*/); add(f == null ? x : (pre + f + post).replace(/\s+/g, " ").replace(/\s([.,!?])/g, "$1"), "", r.lvl, "daily", r.name); }));
  BANK.forEach(b => add(b.en, b.fr, b.lvl, b.part, b.part === "business" ? "Phrases du commerce" : "Phrases du quotidien"));

// Leçons de 8 phrases, de la plus courte à la plus longue, par partie et par niveau
const DIC_LESSONS = (() => {
  const out = [];
  ["daily", "business"].forEach(part => CEFR.forEach(l => {
    const pool = DIC_SRC.filter(x => x.part === part && x.lvl === l).sort((a, b) => a.n - b.n || a.en.localeCompare(b.en));
    for (let i = 0; i * 8 < pool.length; i++) { const items = pool.slice(i * 8, i * 8 + 8); if (items.length >= 4) out.push({id: "dic_" + part + "_" + l + "_" + (i + 1), part, lvl: l, num: i + 1, items}); }

function dicItem(x) { return {t: "dic", en: x.en, fr: x.fr || trFR(x.en) || "", voice: x.voice, key: "dic:" + hash(x.en), src: "Dictée · " + x.src, lvl: x.lvl, skill: "lis"}; }

// Alignement mot à mot entre la phrase entendue et ce qui a été écrit
function dicDiff(target, typed) {
  // chaque mot affiché peut correspondre à plusieurs mots normalisés (She's → she is)
  const T = target.split(/\s+/).filter(Boolean), groups = T.map(w => norm(w).split(" ").filter(Boolean));
  const tn = [], owner = []; groups.forEach((g, gi) => g.forEach(x => { tn.push(x); owner.push(gi); }));
  const un = norm(typed).split(" ").filter(Boolean);
  const m = tn.length, n = un.length, L = Array.from({length: m + 1}, () => new Array(n + 1).fill(0));
  const close = (a, b) => a === b ? 2 : (a.length >= 5 && lev(a, b) <= 1 ? 1 : 0);
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L[i][j] = close(tn[i], un[j]) ? 1 + L[i + 1][j + 1] : Math.max(L[i + 1][j], L[i][j + 1]);
  const st = new Array(m).fill(0), typedAs = new Array(m).fill(""), extra = []; let i = 0, j = 0;
  while (i < m && j < n) {
    const c = close(tn[i], un[j]);
    if (c && L[i][j] === 1 + L[i + 1][j + 1]) { st[i] = c; typedAs[i] = un[j]; i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) i++;
    else { extra.push(un[j]); j++; }
  }
  while (j < n) { extra.push(un[j]); j++; }
  let pts = 0;
  const marks = T.map((w, gi) => {
    const idx = owner.map((o, k) => o === gi ? k : -1).filter(k => k >= 0);
    if (!idx.length) return [w, "ok"];
    const all2 = idx.every(k => st[k] === 2), any = idx.some(k => st[k]);
    const k = all2 ? "ok" : any ? "near" : "miss"; pts += k === "ok" ? 1 : k === "near" ? .5 : 0;
    return [w, k, idx.map(x => typedAs[x]).join(" ")];
  });
  const score = T.length ? Math.max(0, pts - extra.length * .5) / T.length : 0;
  return {marks, extra, score, perfect: marks.every(x => x[1] === "ok") && !extra.length};
}

function bankItem(b, mode) {

  if (mode === "dic") return Object.assign(dicItem({en: b.en, fr: b.fr, voice: "a", src: "Phrases", lvl: b.lvl}), {key: key + ":d", src: b.part === "business" ? "Phrases du commerce" : "Phrases du quotidien"});
  if (mode === "sp") return {t: "sp", en: b.en, fr: b.fr, key: key + ":s", src: "Phrases · à dire", lvl: b.lvl, noMist: true};
  const others = shuffle(BANK.filter(x => x !== b).flatMap(x => x.en.replace(/[.,!?;:]/g, "").split(" "))).filter(w => !b.en.includes(w)).slice(0, 3);
  return {t: "tr", fr: b.fr, a: [b.en], d: others, key: key + ":t", src: "Phrases · à traduire", lvl: b.lvl, skill: "oral"};
}
function bankPool(part, sk = "oral") {
  const li = cefrIdx(sk);
  const pool = BANK.filter(b => (!part || b.part === part) && Math.abs(CEFR.indexOf(b.lvl) - li) <= 1);

    <p style="opacity:.92">${vdue ? `${vdue} mot${vdue > 1 ? "s" : ""} à réviser, ` : ""}${due ? `${due} erreur${due > 1 ? "s" : ""} à revoir, ` : ""}3 mots nouveaux, 5 phrases à corriger, de la grammaire, 2 phrases en dictée et une phrase à dire.</p>

  </section>
  <section class="card">
    <div class="row" style="justify-content:space-between"><span class="eyebrow">Ton niveau</span>${last ? pill((last.up ? "↑ " : "↓ ") + skName(last.sk || "gram") + " " + new Date(last.t).toLocaleDateString("fr-FR"), last.up ? "ok" : "warn") : ""}</div>
    <div class="row" style="align-items:baseline;gap:12px"><b class="lvl">${LV[S.li]}</b><span class="muted">${LVNAME[cefr()]} · moyenne de tes 5 compétences</span></div>
    <div class="skills">${SKILLS.map(([k, name]) => { const s = S.sk[k]; const rate = s.n ? Math.round(100 * s.ok / s.n) : 0;
      return `<div class="skrow"><span>${name}</span><b>${LV[s.li]}</b><div class="bar" title="Palier en cours"><i style="width:${100 * Math.min(1, s.n / WIN)}%"></i></div><span class="small muted">${s.n ? rate + " %" : "—"}</span></div>`; }).join("")}</div>
    <p class="small muted">Chaque compétence monte d'un cran quand tu réussis au moins ${UP * 100} % d'un palier, et redescend sous ${DOWN * 100} %. Les exercices difficiles (écrire, traduire, dicter) comptent plus que les QCM, et les questions trop faciles pour ton niveau comptent moitié moins.</p>

    <div class="stat"><b>${words}</b><span>mots acquis sur ${total}</span></div>
    <div class="stat"><b>${mastered}<small>/${RULES.length}</small></b><span>règles maîtrisées</span></div>
    <div class="stat"><b>${Math.round(S.sec / 60)}</b><span>min de pratique</span></div>
    <div class="stat"><b>${S.answered}</b><span>réponses</span></div>
    <div class="stat"><b>${acc}<small>%</small></b><span>de réussite</span></div>
  </div>
  <section class="card"><div class="row" style="justify-content:space-between"><h3>Carnet d'erreurs</h3>${pill(due + " à revoir", due ? "err" : "")}</div>
    <p class="small muted">Tes erreurs de leçons, de dictées, de rédactions et de conversations reviennent après 1, 3, 7, 16 puis 35 jours.</p>
    <div class="row"><button class="btn sm" id="book">Ouvrir le carnet</button></div></section>
  <section class="card">
    <div class="row" style="justify-content:space-between"><h3>Audio</h3>${pill(au.txt, au.cls)}</div>
    <p class="small muted">${AUD.idx ? "Tous les mots, phrases, textes et dialogues intégrés sont lus par une vraie voix anglaise enregistrée (accent américain), quel que soit ton appareil." : "Les enregistrements anglais n'ont pas pu être chargés."}
    Les textes créés par l'IA utilisent la voix anglaise de l'appareil s'il en a une. Une voix française n'est jamais utilisée : sans voix anglaise, le texte n'est pas lu.</p>
    ${!englishVoices().length && voicesReady ? `<p class="small muted">Pour entendre aussi les contenus créés par l'IA sur ce PC : Paramètres Windows › Heure et langue › Voix › Ajouter des voix › English (United States).</p>` : ""}
    <div class="row"><button class="btn sm ghost" id="testv">${ic("play")} Tester la voix</button></div>
  </section>
  <section class="card">
    <h3>Ton objectif</h3><p class="small muted">Oriente le vocabulaire de la séance du jour.</p>
    <div class="levels" id="focus">${[["both", "Les deux"], ["daily", "Vie quotidienne"], ["business", "Commerce"]].map(([k, l]) => `<button data-f="${k}" aria-pressed="${S.focus === k}">${l}</button>`).join("")}</div>
    <details><summary class="small muted" style="cursor:pointer">Régler le niveau à la main</summary>
      <div class="levels" id="lvls" style="margin-top:8px">${LV.map((l, i) => `<button data-l="${i}" aria-pressed="${S.li === i}">${l}</button>`).join("")}</div></details>
  </section>
  <section class="card">
    <div class="row" style="justify-content:space-between"><h3>Tuteur IA</h3><span class="pill ok ai-only">disponible</span><span class="pill ai-off">indisponible</span></div>
    <p class="small muted ai-only">Phrases nouvelles à l'infini pour chaque règle, textes, dialogues et leçons à ton niveau, correction de tes rédactions et traductions, exemples pour chaque mot, conversations corrigées.</p>
    <p class="small muted ai-off">${IN_CLAUDE ? "Autorise l'accès à Claude pour activer le tuteur." : "Le tuteur IA fonctionne quand l'appli est ouverte sur claude.ai. Ici, tout le contenu intégré fonctionne, avec le micro."}</p>
  </section>
  <section class="card">
    <h3>Sauvegarde</h3>
    <p class="small muted">${cloudOn ? "Progression sauvegardée sur ton compte Claude." : "Progression enregistrée dans ce navigateur."} Pour passer ta progression d'une version à l'autre (claude.ai ↔ appli installée), copie-la ici puis colle-la de l'autre côté.</p>
    <textarea id="bk" class="field" rows="3" placeholder="Colle ici une progression copiée pour l'importer"></textarea>
    <div class="row"><button class="btn sm" id="bkout">Copier ma progression</button><button class="btn sm ghost" id="bkin">Importer</button></div>
  </section></div>`;
  $("#go").onclick = () => { const d = dailyItems(); startSession("Séance du jour", d.items, {kind: "daily", used: d.used}); };
  if ($("#accmenu")) $("#accmenu").onclick = () => { const o = $("#accopts"); o.hidden = !o.hidden; $("#accmenu").setAttribute("aria-expanded", !o.hidden); };
  if ($("#acclogout")) $("#acclogout").onclick = accLogout;
  if ($("#accsync")) $("#accsync").onclick = async () => { const r = await accPull(); await accPush(); render(); toast(r === "error" ? "Le serveur ne répond pas pour l'instant." : "Progression synchronisée."); };
  $("#place").onclick = () => { delete S.evalRun; startFullEval(); };
  if ($("#evresume")) $("#evresume").onclick = () => startFullEval(S.evalRun);
  if ($("#evlast")) $("#evlast").onclick = () => renderEvalResults(S.evalLast, false);
  $("#prog").onclick = () => go("progress");
  $("#book").onclick = () => go("book");
  $("#testv").onclick = () => speak("Hello! This is how I sound. Let's practise together.");
  $("#focus").onclick = e => { const b = e.target.closest("[data-f]"); if (b) { S.focus = b.dataset.f; save(); render(); } };
  $("#lvls").onclick = e => { const b = e.target.closest("[data-l]"); if (b) { S.li = +b.dataset.l; S.sk = newSkills(S.li); save(); render(); toast("Niveau réglé sur " + LV[S.li] + " pour toutes les compétences"); } };
  $("#bkout").onclick = () => { const txt = "ATELIER1:" + JSON.stringify(S); const ta = $("#bk"); ta.value = txt; ta.select();
    try { navigator.clipboard.writeText(txt).then(() => toast("Progression copiée. Colle-la dans l'autre version."), () => toast("Sélectionne le texte et copie-le.")); } catch (e) { toast("Sélectionne le texte et copie-le."); } };
  $("#bkin").onclick = () => { const v = $("#bk").value.trim(); if (!v.startsWith("ATELIER1:")) { toast("Colle d'abord une progression copiée depuis l'appli."); return; }
    try { const o = JSON.parse(v.slice(9)); S = migrate(o); S.updatedAt = Date.now(); save(); render(); toast("Progression importée."); } catch (e) { toast("Ce texte est incomplet ou abîmé : recopie-le en entier."); } };
}

// ---------- Progrès ----------
function renderProgress() {
  const days = []; for (let i = 29; i >= 0; i--) { const d = today(Date.now() - i * DAY); days.push([d, S.hist[d] || {n: 0, ok: 0}]); }
  const max = Math.max(10, ...days.map(([, h]) => h.n));
  const W = 600, H = 170, bw = W / 30;
  const bars = days.map(([d, h], i) => { const bh = (H - 30) * h.n / max, x = i * bw + 2;
    const acc = h.n ? h.ok / h.n : 0; const cy = 10 + (H - 30) * (1 - acc);
    return `<rect x="${x}" y="${H - 20 - bh}" width="${bw - 4}" height="${bh}" rx="2" fill="var(--accent)" opacity=".35"><title>${d} : ${h.n} réponses</title></rect>${h.n ? `<circle cx="${x + (bw - 4) / 2}" cy="${cy}" r="3.2" fill="var(--ok)"><title>${Math.round(acc * 100)} % de réussite</title></circle>` : ""}`; }).join("");
  const ticks = [0, 10, 20, 29].map(i => `<text x="${i * bw + bw / 2}" y="${H - 4}" font-size="11" text-anchor="middle" fill="var(--muted)">${days[i][0].slice(8)}/${days[i][0].slice(5, 7)}</text>`).join("");
  const weeks = []; for (let w = 7; w >= 0; w--) { const end = today(Date.now() - w * 7 * DAY), start = today(Date.now() - (w * 7 + 7) * DAY); const a = (S.hist[start] || {}).w, b = (S.hist[end] || {}).w; weeks.push([end, a != null && b != null ? Math.max(0, b - a) : null]); }
  const weakRules = RULES.map(r => [r, ruleState(r.id)]).filter(([, s]) => s.n >= 3).sort((a, b) => a[1].ok / a[1].n - b[1].ok / b[1].n).slice(0, 6);
  const weakWords = Object.entries(S.voc).filter(([, s]) => s[2] - s[3] >= 2).sort((a, b) => (b[1][2] - b[1][3]) - (a[1][2] - a[1][3])).slice(0, 10);
  app.innerHTML = `<div class="wrap">${backBar("Mes progrès", () => go("home"))}
    <h1>Mes progrès</h1>
    <section class="card"><h3>30 derniers jours</h3><p class="small muted">Barres : nombre de réponses. Points verts : pourcentage de réussite (plus haut = mieux).</p>
      <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:420px;height:auto" role="img" aria-label="Activité des 30 derniers jours">${bars}${ticks}</svg></div></section>
    <section class="card"><h3>Niveau par compétence</h3>
      <div class="skills">${SKILLS.map(([k, n]) => `<div class="skrow"><span>${n}</span><b>${LV[S.sk[k].li]}</b><div class="ladder" style="grid-column:span 2">${LV.map((_, i) => `<i class="${i < S.sk[k].li ? "done" : i === S.sk[k].li ? "cur" : ""}"></i>`).join("")}</div></div>`).join("")}</div>
      ${S.lvlLog.length ? `<p class="small muted">Derniers changements : ${S.lvlLog.slice(0, 6).map(l => `${skName(l.sk || "gram")} ${l.up ? "↑" : "↓"} ${LV[l.li]} (${new Date(l.t).toLocaleDateString("fr-FR")})`).join(" · ")}</p>` : ""}</section>
    ${S.evalLast ? `<section class="card"><div class="row" style="justify-content:space-between"><h3>Dernière évaluation</h3><button class="btn sm" id="evlast2">Revoir mes erreurs</button></div></section>` : ""}
    ${S.evals && S.evals.length ? `<section class="card"><h3>Mes évaluations</h3>${S.evals.slice().reverse().map(e => `<div class="row" style="justify-content:space-between"><span>${new Date(e.t).toLocaleDateString("fr-FR")}</span><span class="small muted">${Object.entries(e.sk).map(([k, v]) => ({gram: "Gram.", voc: "Voc.", lis: "Écoute", read: "Lecture", prod: "Expr."}[k] + " " + LV[Math.round(v)])).join(" · ")}</span><b class="ink">${LV[e.li]}</b></div>`).join("")}</section>` : ""}
    <section class="card"><h3>Mots acquis par semaine</h3>
      <div class="weeks">${weeks.map(([d, n]) => `<div><b>${n == null ? "—" : n}</b><span class="small muted">sem. du ${d.slice(8)}/${d.slice(5, 7)}</span></div>`).join("")}</div>
      <p class="small muted">Total : ${acquiredCount()} mots acquis.</p></section>
    <section class="card"><h3>Règles à retravailler</h3>${weakRules.length ? weakRules.map(([r, s]) => `<div class="row" style="justify-content:space-between"><span>${esc(r.name)}</span><span class="row" style="gap:6px">${pill(Math.round(100 * s.ok / s.n) + " %", "warn")}<button class="btn sm" data-r="${r.id}">S'entraîner</button></span></div>`).join("") : `<p class="small muted">Pas encore assez de réponses.</p>`}</section>
    <section class="card"><h3>Mots qui résistent</h3>${weakWords.length ? `<div class="stack" style="gap:6px">${weakWords.map(([k, s]) => { const [th, en] = k.split("|"); const w = (themeById(th)?.words || []).find(x => x.en === en); return w ? `<div class="row" style="justify-content:space-between"><span><b>${esc(alts(en)[0])}</b> = ${esc(show(w.fr))}</span>${pill((s[2] - s[3]) + " erreurs", "err")}</div>` : ""; }).join("")}</div>` : `<p class="small muted">Aucun pour l'instant.</p>`}</section>
  </div>`;
  $$("[data-r]").forEach(b => b.onclick = () => { const r = ruleById(b.dataset.r); const s = spotSession(8, r.id); startSession(r.name, s.items, {kind: "spot", used: s.used}); });
  if ($("#evlast2")) $("#evlast2").onclick = () => renderEvalResults(S.evalLast, false);
}

// ---------- Mots ----------
function renderWords() {
  if (WORDLIST) return renderWordList(WORDLIST);
  const sec = (part, title, intro) => {
    const ths = THEMES.filter(t => t.part === part);
    const tot = ths.reduce((a, t) => a + t.words.length, 0), got = ths.reduce((a, t) => a + themeStats(t).got, 0);
    const due = wordsDue(ths).length;
    return `<section class="stack" style="gap:12px">
      <div class="card"><div class="row" style="justify-content:space-between"><h2>${title}</h2>${pill(got + " / " + tot + " acquis", "acc")}</div>
      <p class="small muted">${intro}</p>${bar(100 * got / tot)}
      <div class="row"><button class="btn primary" data-learn="${part}">Apprendre${due ? ` · ${due} à réviser` : ""}</button><button class="btn ghost" data-eval="${part}" ${seenWords(ths).length >= 5 ? "" : "disabled"}>Évaluation</button></div></div>
      <div class="list">${ths.map(t => { const s = themeStats(t); const later = CEFR.indexOf(t.lvl) > cefrIdx("voc") + 1;
        return `<article class="card" style="gap:8px"><div class="row" style="justify-content:space-between"><h3>${esc(t.name)}</h3><span class="row" style="gap:6px">${t.colloc ? pill("avec exemples", "acc") : ""}${pill(t.lvl)}${later ? pill("plus tard", "warn") : ""}</span></div>
        ${bar(100 * s.got / s.tot)}<div class="row" style="justify-content:space-between"><span class="small muted">${s.got} acquis · ${s.seen} vus · ${s.tot} mots</span>
        <span class="row" style="gap:6px"><button class="btn sm" data-th="${t.id}">Apprendre</button><button class="btn sm ghost" data-test="${t.id}" title="Valider directement le thème si tu le connais">Je connais : tester</button><button class="btn sm ghost" data-list="${t.id}">Liste</button><button class="btn sm ghost ai-only" data-ctx="${t.id}">En contexte (IA)</button></span></div></article>`; }).join("")}</div></section>`;
  };
  const vdue = wordsDue().length;
  app.innerHTML = `<div class="wrap">
    <div class="stack"><span class="eyebrow">Vocabulaire</span><h1>Apprendre les mots par cœur</h1>
    <p class="muted">Chaque mot passe par des étapes : le découvrir, le reconnaître, le retrouver, l'écrire, le comprendre à l'oral, le replacer dans une phrase. Chaque mot a son propre rythme de révision : un mot facile revient de moins en moins souvent, un mot qui résiste revient plus vite. Tu connais déjà un thème ? Fais son test : à 90 %, tout le thème est validé d'un coup.</p>
    <input id="wsearch" class="field" placeholder="Chercher un mot (anglais ou français)" value="${esc(WSEARCH)}" autocomplete="off">
    <div id="wres"></div>
    <div class="row"><button class="btn" id="vall" ${vdue ? "" : "disabled"}>Réviser tous les mots dus (${vdue})</button><button class="btn primary" id="veval" ${seenWords().length >= 5 ? "" : "disabled"}>Évaluation : 20 mots déjà vus</button></div>
    <p class="small muted">L'évaluation reprend les mots que tu as déjà vus, tous thèmes confondus, en commençant par les plus fragiles. Un mot raté revient dès le lendemain. Chaque leçon de vocabulaire glisse aussi 4 mots d'avant.</p></div>
    ${sec("daily", "Vie quotidienne", "Se présenter, demander, la maison, l'appartement, la rue, le travail, la santé, les loisirs, et les expressions toutes faites.")}
    ${sec("business", "Commerce", "Vente, négociation, marketing, finance, logistique, import-export, réunions, e-mails, service client, contrats, et les collocations du monde des affaires.")}
    <section class="card"><div class="row" style="justify-content:space-between"><h2>Mes mots</h2>${pill(S.mine.length + " mots")}</div>
      <p class="small muted">Les mots que tu touches pendant tes lectures arrivent ici et sont révisés comme les autres.</p>
      <div class="row"><button class="btn sm" data-th="mine" ${S.mine.length ? "" : "disabled"}>Réviser</button><button class="btn sm ghost" data-list="mine" ${S.mine.length ? "" : "disabled"}>Gérer la liste</button></div></section>
  </div>`;
  const doSearch = () => {
    WSEARCH = $("#wsearch").value; const q = norm(WSEARCH); const box = $("#wres");
    if (q.length < 2) { box.innerHTML = ""; return; }
    const res = [];
    [...THEMES, MINE()].forEach(t => t.words.forEach(w => { if (res.length < 40 && (norm(w.en).includes(q) || norm(w.fr).includes(q))) res.push([t, w]); }));
    box.innerHTML = res.length ? `<div class="card" style="padding:4px 0;gap:0">${res.map(([t, w], i) => { const s = vstate(vkey(t.id, w.en)); const st = s ? s[0] : 0;
      return `<button class="wordrow" data-sr="${i}"><span style="min-width:0"><b>${esc(alts(w.en)[0])}</b> <span class="muted small">· ${esc(t.name)}</span><br><span class="muted">${esc(show(w.fr))}</span></span><span class="dots">${[0, 1, 2, 3].map(k => `<i class="${st > k ? "on" : ""}"></i>`).join("")}</span></button>`; }).join("")}</div>`
      : `<p class="small muted">Aucun mot trouvé.</p>`;
    $$("[data-sr]", box).forEach(b => b.onclick = () => speak(alts(res[+b.dataset.sr][1].en)[0]));
  };
  $("#wsearch").oninput = doSearch; if (WSEARCH) doSearch();
  $("#veval").onclick = () => startSession("Évaluation · mots déjà vus", evalItems(null, 20), {kind: "eval"});
  $("#vall").onclick = () => startSession("Révision des mots", wordsDue().slice(0, 25).map(([th, w, st]) => vItem(th, w, modeFor(st[0]))), {kind: "vocab"});
  $$("[data-learn]").forEach(b => b.onclick = () => startSession(b.dataset.learn === "daily" ? "Vie quotidienne" : "Commerce", vocabSession(partThemes(b.dataset.learn), nNewWords()), {kind: "vocab"}));
  $$("[data-th]").forEach(b => b.onclick = () => { const t = themeById(b.dataset.th); const it = vocabSession([t], nNewWords()); if (!it.length) { toast("Tous les mots de ce thème sont à jour. Reviens plus tard pour les révisions."); return; } startSession(t.name, it, {kind: "vocab"}); });
  $$("[data-test]").forEach(b => b.onclick = () => themeTest(themeById(b.dataset.test)));
  $$("[data-eval]").forEach(b => b.onclick = () => startSession("Évaluation · " + (b.dataset.eval === "daily" ? "vie quotidienne" : "commerce"), evalItems(THEMES.filter(t => t.part === b.dataset.eval), 20), {kind: "eval"}));
  $$("[data-list]").forEach(b => b.onclick = () => { WORDLIST = b.dataset.list; renderWords(); window.scrollTo(0, 0); });
  $$("[data-ctx]").forEach(b => b.onclick = () => { const t = themeById(b.dataset.ctx); const ws = shuffle(t.words).slice(0, 18).map(w => alts(w.en)[0] + " (" + alts(w.fr)[0] + ")").join(", ");
    aiLesson(t.name + " en contexte", `le vocabulaire du thème « ${t.name} ». Utilise en priorité ces mots : ${ws}. Fais surtout des phrases à trous, des traductions et des QCM sur le sens des mots en contexte`, "voc"); });
}
function renderWordList(id) {
  const t = themeById(id), mine = id === "mine";
  app.innerHTML = `<div class="wrap">${backBar(t.lvl + " · " + t.words.length + " mots", () => { WORDLIST = null; renderWords(); })}<h2>${esc(t.name)}</h2>
    <p class="small muted">Touche un mot pour l'entendre. Les points indiquent l'étape d'apprentissage (4 = acquis).${mine ? " Retire les mots que tu ne veux pas réviser." : ""}</p>
    <div class="card" style="padding:4px 0;gap:0">${t.words.map((w, i) => { const s = vstate(vkey(t.id, w.en)); const st = s ? s[0] : 0;
      return `<div class="wordrow"><button class="wordplay" data-i="${i}"><b>${esc(alts(w.en)[0])}</b>${alts(w.en).length > 1 ? ` <span class="muted small">/ ${esc(alts(w.en).slice(1).join(" / "))}</span>` : ""}<br><span class="muted">${esc(show(w.fr))}</span>${w.ex ? `<br><span class="small"><i>${esc(w.ex[0])}</i></span>` : ""}</button><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="dots">${[0, 1, 2, 3].map(k => `<i class="${st > k ? "on" : ""}"></i>`).join("")}</span>${mine ? `<button class="btn sm ghost" data-rm="${i}" aria-label="Retirer">✕</button>` : ""}</span></div>`; }).join("") || `<p class="small muted" style="padding:12px 16px">Aucun mot.</p>`}</div>
    <div class="row"><button class="btn primary" id="learnthis">Apprendre ce thème</button>${!mine ? `<button class="btn ghost" id="testthis">Je connais : tester</button>` : ""}</div></div>`;
  $$(".wordplay").forEach(b => b.onclick = () => { const w = t.words[+b.dataset.i]; speak(alts(w.en)[0]); });
  $$("[data-rm]").forEach(b => b.onclick = () => { const w = S.mine[+b.dataset.rm]; S.mine.splice(+b.dataset.rm, 1); delete S.voc[vkey("mine", w.en)]; save(); renderWordList("mine"); });
  $("#learnthis").onclick = () => { const it = vocabSession([t], nNewWords()); if (!it.length) { toast("Tout est à jour pour ce thème."); return; } WORDLIST = null; startSession(t.name, it, {kind: "vocab"}); };
  if ($("#testthis")) $("#testthis").onclick = () => { WORDLIST = null; themeTest(t); };
  prefetchAudio(t.words.map(w => alts(w.en)[0]));
}
function themeTest(t) {
  const words = shuffle(t.words).slice(0, Math.min(12, t.words.length));
  startSession("Test : " + t.name, words.map(w => vItem(t.id, w, cefrIdx("voc") >= 1 ? "type" : "fr2en")), {kind: "test", test: {type: "theme", id: t.id}});

async function correctWriting(w, text) {
  if (text.split(/\s+/).length < 8) { toast("Écris au moins quelques phrases avant de demander la correction."); return; }
  const btn = $("#wcheck"); btn.disabled = true; btn.textContent = "Correction en cours…";
  const prompt = `Tu es un professeur d'anglais exigeant et bienveillant. Ton élève est francophone, niveau ${levelPrompt("gram")}.
Consigne : ${w.brief}
Texte de l'élève :
"""${text}"""
Corrige ce texte. Renvoie UNIQUEMENT un objet JSON :
{"score":note sur 20 (nombre entier, tenant compte du respect de la consigne, de la grammaire, du vocabulaire et du registre),"comment":"2 à 3 phrases en français : points forts et points à améliorer","corrected":"le texte de l'élève corrigé, en gardant ses idées","errors":[{"wrong":"passage fautif exact","right":"correction","why":"explication courte en français"}],"better":"une version plus naturelle et idiomatique, du niveau visé"}
Relève toutes les vraies fautes (grammaire, orthographe, vocabulaire, registre, faux amis), au maximum 12.`;
  try {
    const r = await sample.json(prompt, {modelTier: "default", cache: false});
    const score = Math.max(0, Math.min(20, Math.round(+r.score || 0)));
    const errs = Array.isArray(r.errors) ? r.errors.filter(e => e && e.wrong && e.right) : [];
    S.writing[w.id] = {score, text, date: Date.now()};
    errs.forEach(e => { const key = "wr:" + hash(norm(e.wrong) + "|" + norm(e.right)); if (!S.mist.some(m => m.k === key)) S.mist.unshift({k: key, it: {t: "fix", wrong: e.wrong, right: e.right, x: e.why || "", src: "Rédaction · " + w.title}, box: 0, due: Date.now() + DAY / 2, n: 1}); });
    if (S.mist.length > 250) S.mist.length = 250;
    const it = {t: "fix", skill: "gram", lvl: w.lvl}; levelTick(it, score >= 14, {}); levelTick(it, score >= 12, {});
    save();
    $("#wout").innerHTML = `<section class="card"><div class="row" style="justify-content:space-between"><h3>Note</h3><b class="lvl" style="font-size:2rem">${score}/20</b></div><p>${esc(r.comment || "")}</p></section>

    if ($("#bplay")) $("#bplay").onclick = () => speak(r.better);
  } catch (e) { const m = aiErr(e); if (m) toast(m); }

}

// lit une réplique et attend la fin (pour enchaîner les voix)
async function speakWait(text, rate, voice, seq) {
  for (const p of splitSpeech(text)) {
    if (seq !== AUD.seq) return;
    const src = await clipSrc(p, voice);
    if (src) await playSrc(src, rate * baseRate(), seq);
    else if (englishVoices().length) await deviceSay(p, rate * baseRate(), voice === "b", seq);
    else { noAudio(); return; }
  }
}

// 5 parties adaptatives (escalier : réussite → plus dur, erreur → plus facile), puis analyse et ajustement de toute l'appli
const EVAL_SECTIONS = [
  {k: "gram", name: "Grammaire", n: 16, w: .25},
  {k: "voc", name: "Vocabulaire", n: 16, w: .25},
  {k: "lis", name: "Écoute", n: 10, w: .2},
  {k: "read", name: "Lecture", n: 6, w: .15},
  {k: "prod", name: "Expression", n: 6, w: .15}

const bandOf = li => CEFR[Math.min(4, Math.floor(li / 2))];
const nearBand = (pool, lvlOf, li) => { for (let d = 0; d < 5; d++) { const b = Math.floor(li / 2); for (const x of [b - d, b + d]) { if (x < 0 || x > 4) continue; const r = pool.filter(p => lvlOf(p) === CEFR[x]); if (r.length) return r; } } return pool; };
function evalItem(sec, li, used) {
  const fresh = arr => { const f = arr.filter(x => !used.has(x.key || x.en || x.s || x.q)); return f.length ? f : arr; };
  if (sec === "gram") {
    if (Math.random() < .6) {
      const r = pick(nearBand(RULES, x => x.lvl, li)); const j = Math.floor(Math.random() * r.ex.length);
      return Object.assign(ruleItem(r, j), {skill: "gram"});
    }
    const us = nearBand(UNITS.filter(u => !u.gen), u => u.lvl, li);
    const items = fresh(us.flatMap(u => u.items.map((it, i) => (it.t === "gap" || it.t === "mcq" || it.t === "spot") ? unitItem(u, i) : null)).filter(Boolean));
    return Object.assign(pick(items), {skill: "gram"});
  }
  if (sec === "voc") {
    const t = pick(nearBand(THEMES.filter(t => !t.colloc), x => x.lvl, li));
    const w = pick(t.words.filter(w => !/…/.test(w.en)));
    return Object.assign(vItem(t.id, w, li >= 3 ? "type" : "fr2en"), {skill: "voc", noVoc: true});
  }
  if (sec === "lis") {
    const pool = DIC_SRC.filter(x => canHear(x.en, x.voice));
    if (!pool.length) return null;
    return Object.assign(dicItem(pick(fresh(nearBand(pool, x => x.lvl, li)))), {skill: "lis"});
  }
  if (sec === "read") {
    const t = pick(nearBand(TEXTS, x => x.lvl, li)); const q = pick(t.q);
    const order = shuffle(q.o.map((o, i) => i));
    return {t: "rmcq", tid: t.id, text: t.text, title: t.title, q: q.q, o: order.map(i => q.o[i]), a: order.indexOf(q.a || 0), key: "rq:" + t.id + ":" + q.q, skill: "read", lvl: t.lvl, noSay: true, noMist: true};
  }
  // expression : traduire une phrase française en anglais (clavier ou micro)
  const us = nearBand(UNITS.filter(u => !u.gen), u => u.lvl, li);
  const trs = us.flatMap(u => u.items.map((it, i) => it.t === "tr" ? unitItem(u, i) : null)).filter(Boolean);
  const bank = typeof BANK !== "undefined" && aiReady() ? nearBand(BANK, x => x.lvl, li).map(x => ({t: "tr", fr: x.fr, a: [x.en], d: [], key: "bk:" + hash(x.en), lvl: x.lvl, src: "Expression"})) : [];

    else if (o.t === "tr" && o.fr && strs(o.a).length) it = {t: "tr", fr: o.fr, a: strs(o.a), d: strs(o.d).slice(0, 4), x: o.x || ""};

    else if (o.t === "sp" && o.en) it = {t: "sp", en: o.en, fr: o.fr || "", noMist: true};

}

    <div class="composer"><div class="in">${micHTML("cmic")}
    <textarea id="cin" class="field" placeholder="Réponds en anglais (tape ou dicte)" rows="1"></textarea>
    <button class="round" id="csend" aria-label="Envoyer">${IC.send}</button></div></div>`;
  $("#cquit").onclick = () => { if (CHAT && CHAT.ctl) CHAT.ctl.abort(); const n = CHAT.corrections; render(); if (n) toast(n + " correction" + (n > 1 ? "s ajoutées" : " ajoutée") + " au carnet"); };
  const cin = $("#cin");
  cin.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); chatSend(); } };
  $("#csend").onclick = chatSend;
  wireMic("cmic", cin);
  chatCall();
}
function chatAppend(html) { const c = $("#chat"); if (!c) return null; c.insertAdjacentHTML("beforeend", html); window.scrollTo(0, document.body.scrollHeight); return c.lastElementChild; }
function chatSend() {
  if (!CHAT || CHAT.busy) return;
  stopListening();
  const cin = $("#cin"), text = cin.value.trim(); if (!text) return;
  cin.value = "";
  CHAT.turns.push({role: "user", content: "Learner: " + text});
  CHAT.lastUser = chatAppend(`<div class="msg me">${esc(text)}</div>`);
  S.spoken++; S.days[today()] = (S.days[today()] || 0) + 1; save();
  chatCall();
}
async function chatCall() {
  const sc = CHAT.sc; CHAT.busy = true; $("#csend").disabled = true;
  const wait = chatAppend(`<div class="msg bot typing">…</div>`);
  const head = [{role: "user", content: chatRules(sc) + "\n\nStart the conversation now with a short greeting and a first question."}];
  const turns = CHAT.turns.length > 16 ? CHAT.turns.slice(-16) : CHAT.turns;
  if (turns.length && turns[0].role === "user") head.push({role: "assistant", content: JSON.stringify({reply: "(conversation continues)", corrections: [], better: ""})});
  CHAT.ctl = new AbortController(); const myChat = CHAT;
  try {
    const r = await sample.json([...head, ...turns], {modelTier: "quick", cache: false, signal: CHAT.ctl.signal});
    if (CHAT !== myChat) return;
    wait.remove();
    const reply = String(r && r.reply || "").trim() || "Sorry, could you say that again?";
    const corr = Array.isArray(r && r.corrections) ? r.corrections.filter(c => c && c.wrong && c.right && norm(c.wrong) !== norm(c.right)) : [];
    const better = r && typeof r.better === "string" && r.better.trim() && CHAT.turns.length ? r.better.trim() : "";
    if (corr.length || better) {
      chatAppend(`<div class="corr">${corr.map(c => `<div><s>${esc(c.wrong)}</s> → <b>${esc(c.right)}</b>${c.why ? ` <span class="muted">· ${esc(c.why)}</span>` : ""}</div>`).join("")}${better ? `<div><span class="muted">Plus naturel :</span> ${esc(better)} <button class="btn sm ghost" data-b="1" style="min-height:28px;padding:2px 8px">écouter</button></div>` : ""}</div>`);
      const bb = $$("[data-b]").pop(); if (bb) bb.onclick = () => speak(better);
      corr.forEach(c => {
        const it = {t: "fix", wrong: c.wrong, right: c.right, x: c.why || "", src: "Conversation · " + sc.title};
        const key = "chat:" + hash(norm(c.wrong) + "|" + norm(c.right));
        if (!S.mist.some(m => m.k === key)) { S.mist.unshift({k: key, it: strip(it), box: 0, due: Date.now() + DAY / 2, n: 1}); CHAT.corrections++; }
      });
      if (S.mist.length > 250) S.mist.length = 250; save();
    }
    const el = chatAppend(`<div class="msg bot">${esc(reply)} <button class="btn sm ghost" style="min-height:28px;padding:2px 8px;margin-left:4px" aria-label="Réécouter">${ic("play", 16)}</button></div>`);
    el.querySelector("button").onclick = () => speak(reply);
    speak(reply);
    CHAT.turns.push({role: "assistant", content: JSON.stringify({reply, corrections: [], better: ""})});
  } catch (e) {
    if (CHAT !== myChat) return;
    wait.remove(); const m = aiErr(e);
    if (m) chatAppend(`<div class="msg bot" style="color:var(--err)">${esc(m)}</div>`);
    if (CHAT.turns.length && CHAT.turns[CHAT.turns.length - 1].role === "user") { const last = CHAT.turns.pop(); $("#cin").value = last.content.replace(/^Learner: /, ""); if (CHAT.lastUser) CHAT.lastUser.remove(); }
  }
  CHAT.busy = false; const s = $("#csend"); if (s) s.disabled = false;
}

// ====== DÉMARRAGE ======
try {
  const rescue = localStorage.getItem("atelier-eval-rescue");
  if (rescue && !S.evalLast) {
    const R = JSON.parse(rescue);
    if (R && R.log && R.est) { const mapped = {sec: EVAL_SECTIONS.length, done: R.log.length, li: S.li, steps: 0, est: R.est, used: [], t: Date.now(),
      log: R.log.map(l => ({sec: l.sec, li: l.li, ok: l.ok, lvl: l.it && l.it.lvl, q: l.it ? (l.it.rname ? "Règle : " + l.it.rname : l.it.en ? "Vocabulaire : « " + l.it.en + " »" : (l.it.t === "dic" ? "Dictée" : "Question")) : "", you: "", sol: "", x: "", rule: l.it && l.it.rule, rname: l.it && l.it.rname || "", cat: l.it && l.it.cat, th: l.it && l.it.th, en: l.it && l.it.en, fr: "", miss: l.it && l.it.miss}))};
      const last = (S.evals || []).slice(-1)[0];
      // déjà comptée par l'ancienne version : on garde seulement le détail des réponses ; sinon on la termine normalement
      if (last && Date.now() - last.t < 3 * DAY) S.evalLast = {t: last.t, li: last.li, est: R.est, log: mapped.log, changes: null, prev: null};
      else S.evalRun = mapped;
      localStorage.removeItem("atelier-eval-rescue"); save(); }
  }
} catch (e) {}
render();
if (ACC.id) accPull();
loadIndex();
initAI();
initCloud();
// Appli installée (hors claude.ai) : fonctionnement hors ligne
if ("serviceWorker" in navigator && !IN_CLAUDE && window.top === window && /^https:|^http:\/\/localhost/.test(location.href)) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
